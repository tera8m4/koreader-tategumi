name: Release builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2025.05)'
        required: true
      artifacts_run_id:
        description: 'Publish the packages of this earlier run (its ID) instead of building them'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MAKEFLAGS: "PARALLEL_JOBS=3 OUTPUT_DIR=build"
  OTA_BASE_URL: "${{ github.server_url }}/${{ github.repository }}/releases/latest/download"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:

  ffi-cdefs:
    name: LuaJIT FFI declarations
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
      - name: Load every platform C definition with LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y luajit p7zip-full
          for cdef in base/ffi-cdecl/posix_h_{android,linux,macos}*.lua; do
            echo "Checking $cdef"
            luajit "$cdef"
          done
      - name: Check OTA archive conversion
        run: python3 .github/scripts/test-ota-assets.py

  kindle:
    name: Kindle
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindle
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindle
      - name: Package
        run: make TARGET=kindle update
      - name: Rename for release
        run: |
          cp koreader-kindle-*.zip koreader-kindle-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kindle
          if-no-files-found: error
          path: koreader-kindle-latest-stable.zip

  kindlehf:
    name: Kindle (HF)
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindlehf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindlehf
      - name: Package
        run: make TARGET=kindlehf update
      - name: Rename for release
        run: |
          cp koreader-kindlehf-*.zip koreader-kindlehf-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kindlehf
          if-no-files-found: error
          path: koreader-kindlehf-latest-stable.zip

  kindlepw2:
    name: Kindle (PW2/non-HF)
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/kokindle:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kindlepw2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kindlepw2
      - name: Package
        run: make TARGET=kindlepw2 update
      - name: Rename for release
        run: |
          cp koreader-kindlepw2-*.zip koreader-kindlepw2-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kindlepw2
          if-no-files-found: error
          path: koreader-kindlepw2-latest-stable.zip

  kobo:
    name: Kobo
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/kokobo:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: kobo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=kobo
      - name: Package
        run: make TARGET=kobo update
      - name: Rename for release
        run: |
          cp koreader-kobo-*.zip koreader-kobo-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kobo
          if-no-files-found: error
          path: koreader-kobo-latest-stable.zip

  pocketbook:
    name: PocketBook
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/kopb:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: pocketbook
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=pocketbook
      - name: Package
        run: make TARGET=pocketbook update
      - name: Rename for release
        run: |
          cp koreader-pocketbook-*.zip koreader-pocketbook-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbook
          if-no-files-found: error
          path: koreader-pocketbook-latest-stable.zip

  pocketbookhf:
    name: PocketBook (HF)
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/kopb:2.1.0-22.04
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: pocketbookhf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=pocketbookhf
      - name: Package
        run: make TARGET=pocketbookhf update
      - name: Rename for release
        run: |
          cp koreader-pocketbookhf-*.zip koreader-pocketbookhf-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pocketbookhf
          if-no-files-found: error
          path: koreader-pocketbookhf-latest-stable.zip

  cervantes:
    name: Cervantes
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/kocervantes:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: cervantes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=cervantes
      - name: Package
        run: make TARGET=cervantes update
      - name: Rename for release
        run: |
          cp koreader-cervantes-*.zip koreader-cervantes-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cervantes
          if-no-files-found: error
          path: koreader-cervantes-latest-stable.zip

  remarkable:
    name: reMarkable (armhf)
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/koremarkable:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: remarkable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=remarkable
      - name: Package
        run: make TARGET=remarkable update
      - name: Rename for release
        run: |
          cp koreader-remarkable-*.zip koreader-remarkable-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: remarkable
          if-no-files-found: error
          path: koreader-remarkable-latest-stable.zip

  remarkable-aarch64:
    name: reMarkable (aarch64)
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    container:
      image: koreader/koremarkable:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: remarkable-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=remarkable-aarch64
      - name: Package
        run: make TARGET=remarkable-aarch64 update
      - name: Rename for release
        run: |
          cp koreader-remarkable-aarch64-*.zip koreader-remarkable-aarch64-latest-stable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: remarkable-aarch64
          if-no-files-found: error
          path: koreader-remarkable-aarch64-latest-stable.zip

  # Forks without the APK signing secrets release without Android.
  android-signing:
    name: Android signing key
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then available=true; else available=false; fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

  android-arm:
    name: Android (ARM)
    needs: android-signing
    if: needs.android-signing.outputs.available == 'true'
    runs-on: ubuntu-latest
    container:
      image: koreader/koandroid:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
      ANDROID_ARCH: arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android
      - name: Package
        run: make TARGET=android update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for release
        run: cp koreader-android-*.apk koreader-android-latest-stable.apk 2>/dev/null || \
             cp koreader-android-*.zip koreader-android-latest-stable.zip 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm
          path: koreader-android-latest-stable.*

  android-arm64:
    name: Android (ARM64)
    needs: android-signing
    if: needs.android-signing.outputs.available == 'true'
    runs-on: ubuntu-latest
    container:
      image: koreader/koandroid:latest
    env:
      BASH_ENV: /home/ko/.bashrc
      TARGET: android
      ANDROID_ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Fetch submodules
        run: make fetchthirdparty
      - name: Build
        run: make TARGET=android ANDROID_ARCH=arm64
      - name: Package
        run: make TARGET=android ANDROID_ARCH=arm64 update
      - name: Sign APK
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -1)
          "${APKSIGNER}" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:${{ secrets.ANDROID_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            koreader-android-*.apk
          rm -f /tmp/release.keystore
      - name: Rename for release
        run: cp koreader-android-arm64-*.apk koreader-android-arm64-latest-stable.apk || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: koreader-android-arm64-latest-stable.apk

  jitendex:
    name: Jitendex dictionary
    if: ${{ !inputs.artifacts_run_id }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.download.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the latest Jitendex for Yomitan
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view --repo stephenmk/stephenmk.github.io --json tagName -q .tagName)
          gh release download "$version" --repo stephenmk/stephenmk.github.io \
            --pattern jitendex-yomitan.zip --dir jitendex-src
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Convert for yomitan.koplugin
        run: |
          # Pillow converts images KOReader cannot display.
          pip install Pillow
          python3 tools/yomitan_convert.py -o jitendex-out jitendex-src/jitendex-yomitan.zip
          # Unzipped into koreader/data/yomitan/ on the device.
          (cd jitendex-out && zip -qr ../yomitan-jitendex.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: jitendex
          if-no-files-found: error
          path: yomitan-jitendex.zip

  release:
    name: Create Release
    needs: [ffi-cdefs, kindle, kindlehf, kindlepw2, kobo, pocketbook, pocketbookhf, cervantes, remarkable, remarkable-aarch64, android-signing, android-arm, android-arm64, jitendex]
    # Also when builds were skipped: no Android signing key, or an earlier
    # run's packages.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Fetch kotasync source
        run: git submodule update --init --recursive base

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Convert ZIPs to OTA archives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          bash .github/scripts/convert-ota-assets.sh artifacts stable "$RELEASE_TAG"

      - name: Create OTA aliases and versioned copies
        run: |
          TAG=$RELEASE_TAG
          # kobov5: same binary as kobo (FW 5.x uses different ota_model string)
          cp artifacts/kobo/koreader-kobo-latest-stable.zip \
             artifacts/kobo/koreader-kobov5-latest-stable.zip
          cp artifacts/kobo/koreader-kobo-latest-stable.targz \
             artifacts/kobo/koreader-kobov5-latest-stable.targz
          # kindle-legacy: same binary as kindle (non-touch Kindles)
          cp artifacts/kindle/koreader-kindle-latest-stable.zip \
             artifacts/kindle/koreader-kindle-legacy-latest-stable.zip
          cp artifacts/kindle/koreader-kindle-latest-stable.targz \
             artifacts/kindle/koreader-kindle-legacy-latest-stable.targz
          # Versioned copies of all zips and targz files
          for f in artifacts/**/*-latest-stable.zip artifacts/**/*-latest-stable.targz; do
            cp "$f" "${f/latest-stable/$TAG}"
          done
          # Versioned copies of APKs
          for f in artifacts/**/*-latest-stable.apk; do
            cp "$f" "${f/latest-stable/$TAG}" 2>/dev/null || true
          done
          # Android "link" type OTA index files (no extension, first line = APK filename)
          # otamanager downloads koreader-android[-arm64]-latest-stable (no ext),
          # reads line 1 as the APK filename, then downloads that APK directly.
          if [ -d artifacts/android-arm64 ]; then
            echo "koreader-android-arm64-$TAG.apk" \
              > artifacts/android-arm64/koreader-android-arm64-latest-stable
          fi
          if [ -d artifacts/android-arm ]; then
            echo "koreader-android-$TAG.apk" \
              > artifacts/android-arm/koreader-android-latest-stable
          fi

      - name: Generate zsync files
        run: |
          # OTA packages are .targz (gzipped tar), not .zip.
          # koreader.sh applies the update with: tar -xf koreader.updated.tar
          # GNU tar auto-detects gzip, so .targz works fine.
          # zsyncmake input = versioned .targz → Filename header = versioned name
          # OTA manager reads Filename to extract version (v2026.05 pattern).
          # zsync2 downloads: getOTAServer() + Filename = releases/.../koreader-X-v2026.05.targz
          sudo apt-get update -qq && sudo apt-get install -y zsync
          TAG=$RELEASE_TAG
          shopt -s globstar
          for f in artifacts/**/*-"$TAG".targz; do
            name=$(basename "$f")
            stable_name="${name/$TAG/latest-stable}"
            dir=$(dirname "$f")
            zsyncmake -u "$OTA_BASE_URL/$stable_name" \
              -o "$dir/${stable_name%.targz}.zsync" \
              "$f"
          done
          # Versioned zsync copies
          for f in artifacts/**/*-latest-stable.zsync; do
            cp "$f" "${f/latest-stable/$TAG}"
          done

      - name: Build kotasync manifest tool
        run: |
          # kotasync shares KOReader's third-party build setup, which requires
          # Meson even though the resulting AppRun is only used for manifests.
          sudo apt-get update -qq && sudo apt-get install -y meson
          make -C base/kotasync appdir
          echo "KOTASYNC=$(find "$PWD/base/kotasync/build" -path '*/AppDir/AppRun' -type f -print -quit)" >> "$GITHUB_ENV"

      - name: Generate kotasync files
        run: |
          set -euo pipefail
          TAG=$RELEASE_TAG
          shopt -s globstar
          cp "artifacts/kobo/koreader-kobo-$TAG.tar.xz" "artifacts/kobo/koreader-kobov5-$TAG.tar.xz"
          cp "artifacts/kindle/koreader-kindle-$TAG.tar.xz" "artifacts/kindle/koreader-kindle-legacy-$TAG.tar.xz"
          for package in artifacts/**/*.tar.xz; do
            name=$(basename "$package")
            latest_name="${name/$TAG/latest-stable}"
            "$KOTASYNC" make "$package" "$(dirname "$package")/${latest_name%.tar.xz}.kotasync"
          done

      - name: Include legacy migration helper
        run: |
          mkdir -p artifacts/migration
          cp tools/migration/otamanager.lua artifacts/migration/otamanager.lua

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Extract tag annotation
        run: |
          git fetch --tags --force 2>/dev/null || true
          DELIM=$(openssl rand -hex 8)
          {
            echo "TAG_NOTES<<$DELIM"
            git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(contents)' 2>/dev/null || true
            echo "$DELIM"
          } >> $GITHUB_ENV

      - name: Android rows and Jitendex version
        run: |
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/$RELEASE_TAG"
          DELIM=$(openssl rand -hex 8)
          {
            echo "ANDROID_ROWS<<$DELIM"
            if [ -d artifacts/android-arm ]; then
              echo "| Android (ARM) | [koreader-android-$RELEASE_TAG.apk]($base/koreader-android-$RELEASE_TAG.apk) |"
            fi
            if [ -d artifacts/android-arm64 ]; then
              echo "| Android (ARM64) | [koreader-android-arm64-$RELEASE_TAG.apk]($base/koreader-android-arm64-$RELEASE_TAG.apk) |"
            fi
            echo "$DELIM"
          } >> "$GITHUB_ENV"
          version="${{ needs.jitendex.outputs.version }}"
          if [ -z "$version" ]; then
            # An earlier run's package: its folder is named after the dictionary title.
            version=$(unzip -Z1 artifacts/jitendex/yomitan-jitendex.zip | head -1 | cut -d/ -f1)
          fi
          echo "JITENDEX_VERSION=$version" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "koreader-tategumi ${{ env.RELEASE_TAG }}"
          body: |
            ${{ env.TAG_NOTES }}


            ## Downloads

            | Platform | Package |
            |----------|---------|
            | Kindle (HF, Touch and newer) | [koreader-kindlehf-${{ env.RELEASE_TAG }}.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-kindlehf-${{ env.RELEASE_TAG }}.zip) |
            | Kindle (PW2 / non-HF) | [koreader-kindlepw2-${{ env.RELEASE_TAG }}.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-kindlepw2-${{ env.RELEASE_TAG }}.zip) |
            | Kindle (legacy non-touch) | [koreader-kindle-legacy-${{ env.RELEASE_TAG }}.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-kindle-legacy-${{ env.RELEASE_TAG }}.zip) |
            | Kobo | [koreader-kobo-${{ env.RELEASE_TAG }}.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-kobo-${{ env.RELEASE_TAG }}.zip) |
            | PocketBook | [koreader-pocketbook-${{ env.RELEASE_TAG }}.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-pocketbook-${{ env.RELEASE_TAG }}.zip) |
            | Cervantes | [koreader-cervantes-${{ env.RELEASE_TAG }}.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-cervantes-${{ env.RELEASE_TAG }}.zip) |
            | reMarkable (armhf) | [koreader-remarkable-${{ env.RELEASE_TAG }}.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-remarkable-${{ env.RELEASE_TAG }}.zip) |
            | reMarkable (aarch64) | [koreader-remarkable-aarch64-${{ env.RELEASE_TAG }}.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/koreader-remarkable-aarch64-${{ env.RELEASE_TAG }}.zip) |
            ${{ env.ANDROID_ROWS }}

            ## Japanese dictionary

            [yomitan-jitendex.zip](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/yomitan-jitendex.zip): [Jitendex](https://jitendex.org) (${{ env.JITENDEX_VERSION }}), converted for `yomitan.koplugin`. Unzip it into `koreader/data/yomitan/`, then enable it in **Search settings → Yomitan dictionaries**. Jitendex is licensed under [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/) and includes material from the JMdict dictionary files of the [Electronic Dictionary Research and Development Group](https://www.edrdg.org/).
          files: artifacts/**/*
          draft: false
          prerelease: false
